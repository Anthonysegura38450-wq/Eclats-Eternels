<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Éclats Éternels</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0820;color:#fff;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  :root{--bg1:#2a1050;--bg2:#0b0820}
  body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 70%);display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #top{text-align:center;padding:14px 12px 0}
  #score{font-size:clamp(34px,10vw,52px);font-weight:800;
    background:linear-gradient(90deg,#7df9ff,#c77dff,#ff7de0);-webkit-background-clip:text;background-clip:text;color:transparent}
  #rate{opacity:.75;font-size:14px;margin-top:2px}
  #stage{position:relative;flex:0 0 38%;display:flex;align-items:center;justify-content:center}
  #gem{width:min(46vw,200px);aspect-ratio:.8;cursor:pointer;transition:transform .06s;filter:drop-shadow(0 0 30px #7df9ffaa)}
  #gem.hit{transform:scale(.9)}
  .pop{position:absolute;pointer-events:none;font-weight:800;font-size:24px;color:#ffe27d;text-shadow:0 0 8px #000;
    animation:up .9s ease-out forwards}
  @keyframes up{to{transform:translateY(-90px);opacity:0}}
  #shop,#shop2{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px;-webkit-overflow-scrolling:touch}
  .up{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 8px;padding:10px 12px;border-radius:14px;border:1px solid #ffffff22;
    background:#ffffff10;color:#fff;text-align:left;font:inherit}
  .up:disabled{opacity:.4}
  .up:not(:disabled):active{background:#7df9ff33;transform:scale(.98)}
  .ico{font-size:28px;width:36px;text-align:center}
  .nm{font-weight:700}.ds{font-size:12px;opacity:.7}
  .pr{margin-left:auto;text-align:right;font-weight:700;color:#7df9ff;white-space:nowrap}
  .lv{font-size:12px;opacity:.7;font-weight:400;color:#fff}
  #bar{display:flex;justify-content:center;gap:8px;padding:0 12px 6px;font-size:12px}
  #bar button{background:none;border:1px solid #ffffff33;color:#ffffffaa;border-radius:20px;padding:5px 12px;font:inherit}
  #tabs{display:flex;gap:8px;padding:0 12px 8px}
  #tabs button{flex:1;padding:9px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff10;color:#fff;font:inherit;font-weight:700}
  #tabs button.on{background:linear-gradient(90deg,#7df9ff55,#c77dff55);border-color:#7df9ff}
  #qty{display:flex;gap:6px;padding:0 12px 8px}
  #qty button{flex:1;padding:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font:inherit;font-weight:700;font-size:14px}
  #qty button.on{background:#ffe27d33;border-color:#ffe27d;color:#ffe27d}
  #tabs button{font-size:14px;padding:9px 4px}
  .ach{opacity:.55}.ach.done{opacity:1;border-color:#7dffb0;background:#7dffb014}
  .ach .bar{height:5px;border-radius:4px;background:#ffffff22;margin-top:5px;overflow:hidden}.ach .bar i{display:block;height:100%;background:#7df9ff}
  .sec{margin:10px 2px 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.6}
  .up.own .pr{color:#7dffb0}.up.eq{border-color:#ffe27d;background:#ffe27d18}.up.eq .pr{color:#ffe27d}
  #frz{z-index:4;pointer-events:none;text-shadow:0 0 6px #000;display:none;position:absolute;bottom:4px;left:0;right:0;text-align:center;font-weight:800;color:#ffb347}
  .rainbow #gem{animation:rb 4s linear infinite}@keyframes rb{to{filter:drop-shadow(0 0 30px #fff8) hue-rotate(360deg)}}
  #ev{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .gold,.star{position:absolute;pointer-events:auto;cursor:pointer}
  .gold{width:64px;height:80px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
    background:linear-gradient(135deg,#fff7b0,#ffb300 60%,#ff8a00);filter:drop-shadow(0 0 14px #ffd54a);
    animation:gpulse .6s ease-in-out infinite alternate,gdrift 8s linear forwards}
  @keyframes gpulse{to{transform:scale(1.18) rotate(8deg)}}
  @keyframes gdrift{from{margin-left:0}to{margin-left:var(--dx)}}
  .star{font-size:34px;filter:drop-shadow(0 0 8px #fff);animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(calc(100vh + 80px)) rotate(360deg)}}
  .evmsg{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:8;
    background:#ffb300dd;color:#2a1050;font-weight:800;padding:6px 14px;border-radius:20px;pointer-events:none;font-size:14px}
  #toast{pointer-events:none;position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#000c;padding:12px 18px;border-radius:14px;
    text-align:center;display:none;max-width:85vw;z-index:9}
</style>
</head>
<body>
<div id="top"><div id="score">0</div><div id="rate"></div></div>
<div id="stage">
  <div id="frz"></div>
  <svg id="gem" viewBox="0 0 100 125">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop id="s1" offset="0" stop-color="#7df9ff"/><stop id="s2" offset="1" stop-color="#c77dff"/></linearGradient></defs>
    <path d="M50 2 96 62 50 123 4 62Z" fill="url(#g)"/>
    <path d="M50 2 96 62 50 62Z" fill="#fff" opacity=".4"/>
    <path d="M50 62 4 62 50 2Z" fill="#fff" opacity=".15"/>
  </svg>
</div>
<div id="tabs"><button id="t1" class="on">⚒️ Améliorer</button><button id="t2">🛍️ Boutique</button><button id="t3">🏆 Succès</button></div>
<div id="qty"></div>
<div id="shop"></div>
<div id="shop3" style="display:none;flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px"></div>
<div id="shop2" style="display:none;flex:1;overflow-y:auto;padding:8px 12px 12px"></div>
<div id="bar"><button id="rs">Renaissance</button><button id="rst">Tout effacer</button></div>
<div id="ev"></div>
<div id="toast"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const UPS=[
 {id:'tap',ico:'👆',nm:'Doigt de lumière',   ds:'+1 éclat par clic',base:40,    g:1.17,click:1},
 {id:'spr',ico:'✨',nm:'Étincelle',          ds:'+1 éclat / s',     base:120,   g:1.25,ps:1},
 {id:'min',ico:'⛏️',nm:'Mineur de cristal',  ds:'+5 éclats / s',    base:1200,  g:1.25,ps:5},
 {id:'gol',ico:'🗿',nm:'Golem de quartz',    ds:'+30 éclats / s',   base:14000, g:1.25,ps:30},
 {id:'dra',ico:'🐉',nm:'Dragon prismatique', ds:'+200 éclats / s',  base:160000,g:1.25,ps:200},
 {id:'sta',ico:'🌟',nm:'Étoile éternelle',   ds:'+1500 éclats / s', base:1800000,g:1.25,ps:1500},
];
const SKINS=[
 {id:'ame',nm:'Améthyste',c:['#7df9ff','#c77dff'],glow:'#7df9ffaa',price:0},
 {id:'rub',nm:'Rubis',c:['#ff9db5','#e0103a'],glow:'#ff2d55aa',price:3000},
 {id:'eme',nm:'Émeraude',c:['#9dffc8','#00a86b'],glow:'#00e08aaa',price:15000},
 {id:'or', nm:'Or pur',c:['#fff3a8','#ffa500'],glow:'#ffc400aa',price:80000},
 {id:'gla',nm:'Glace',c:['#f0fcff','#3d9bff'],glow:'#8fd3ffaa',price:400000},
 {id:'obs',nm:'Obsidienne',c:['#8a8aaa','#14142a'],glow:'#8a8aaaaa',price:2500000},
 {id:'arc',nm:'Arc-en-ciel',c:['#ff7de0','#7df9ff'],glow:'#fff8',price:25000000,rainbow:1},
];
const THEMES=[
 {id:'nuit',nm:'Nuit violette',b:['#2a1050','#0b0820'],price:0},
 {id:'aur', nm:'Aurore',b:['#0e5a5a','#07141f'],price:8000},
 {id:'bra', nm:'Braises',b:['#6a1a0a','#150505'],price:40000},
 {id:'for', nm:'Forêt féerique',b:['#14532d','#04140b'],price:200000},
 {id:'aby', nm:'Abysses',b:['#0b3a8a','#020617'],price:1500000},
 {id:'cos', nm:'Nébuleuse',b:['#7a1f6b','#0a0320'],price:10000000},
];
// ---- Gemmes : 100 % gratuites, gagnées en jouant (succès et renaissances) ----
const MIL_STEP=5; // paliers du ×10 : 1M, 5M, 25M, 125M… (chaque palier = 5× le précédent)
const GEMS_PER_ACH=10,GEMS_PER_ETERNITY=10;
const PRISMS=[
 {id:'p1',nm:'Prisme I',price:20},{id:'p2',nm:'Prisme II',price:50},{id:'p3',nm:'Prisme III',price:100},
 {id:'p4',nm:'Prisme IV',price:200},{id:'p5',nm:'Prisme V',price:400},
];
const HEARTS=[{id:'h1',nm:'Cœur de cristal I',price:60000},{id:'h2',nm:'Cœur de cristal II',price:600000},{id:'h3',nm:'Cœur de cristal III',price:6000000}];
const KEY='ee_clicker';
let S={score:0,total:0,lv:{},eternity:0,last:Date.now(),own:{ame:1,nuit:1},skin:'ame',theme:'nuit',frenzy:0,gems:0,surge:0,nextMil:1e6,golds:0,stars:0,daily:{d:'',n:0},clicks:0,maxTotal:0,frenzies:0,rebirths:0,ach:{}};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(S,r)}catch(e){}
S.own=Object.assign({ame:1,nuit:1},S.own);S.ach=S.ach||{};
UPS.forEach(u=>S.lv[u.id]=S.lv[u.id]||0);

const frenzyOn=()=>Date.now()<S.frenzy;
const hearts=()=>HEARTS.filter(h=>S.own[h.id]).length;
const achCount=()=>Object.keys(S.ach).length;
const prisms=()=>PRISMS.filter(x=>S.own[x.id]).length;
const surgeOn=()=>Date.now()<S.surge;
const weekend=()=>[0,6].includes(new Date().getDay());
const mult=()=>(surgeOn()?10:1)*(weekend()?1.5:1)*(1+prisms()*0.1)*(1+S.eternity*0.25)*(1+hearts()*0.25)*(1+achCount()*0.02)*(frenzyOn()?3:1);
const cost=u=>Math.ceil(u.base*Math.pow(u.g,S.lv[u.id]));
let qty=1;
// coût de n niveaux d'un coup (somme géométrique)
const costN=(u,n)=>Math.ceil(u.base*Math.pow(u.g,S.lv[u.id])*(Math.pow(u.g,n)-1)/(u.g-1));
const maxN=u=>{let n=0;while(n<1000&&costN(u,n+1)<=S.score)n++;return n};
const wantN=u=>qty==='max'?Math.max(1,maxN(u)):qty;
const perClick=()=>(1+UPS.reduce((a,u)=>a+(u.click||0)*S.lv[u.id],0))*mult();
const perSec=()=>UPS.reduce((a,u)=>a+(u.ps||0)*S.lv[u.id],0)*mult();
const baseSec=()=>perSec()/mult();
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n)+'';
  const s=['k','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<s.length-1){n/=1000;i++}return n.toFixed(n<10?2:1)+s[i]};
const ETERNITY_AT=1e7;
const gain=()=>Math.floor(Math.sqrt(S.total/ETERNITY_AT));
const frenzyPrice=()=>Math.max(800,Math.ceil(baseSec()*200));
const save=()=>{S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// Retour haptique : natif dans l'app iOS (Capacitor), vibration web sinon
const vib=ms=>{
  try{const H=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;
    if(H){if(Array.isArray(ms))H.notification({type:'SUCCESS'});else H.impact({style:ms<=15?'LIGHT':'MEDIUM'});return}
    navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let ac;function tick(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.06;
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.08);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}catch(e){}}
function toast(h,ms=3500){const t=$('toast');t.innerHTML=h;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}

// ---------- Styles ----------
function applyStyle(){
  const sk=SKINS.find(x=>x.id===S.skin)||SKINS[0],th=THEMES.find(x=>x.id===S.theme)||THEMES[0];
  $('s1').setAttribute('stop-color',sk.c[0]);$('s2').setAttribute('stop-color',sk.c[1]);
  $('gem').style.filter=`drop-shadow(0 0 30px ${sk.glow})`;
  document.body.classList.toggle('rainbow',!!sk.rainbow);
  document.documentElement.style.setProperty('--bg1',th.b[0]);document.documentElement.style.setProperty('--bg2',th.b[1]);
  $('top') && document.querySelector('meta[name=theme-color]').setAttribute('content',th.b[1]);
}

// ---------- Boutique : améliorations ----------
const shop=$('shop');
UPS.forEach(u=>{const b=document.createElement('button');b.className='up';b.id='u_'+u.id;
  b.innerHTML=`<span class="ico">${u.ico}</span><span><div class="nm">${u.nm} <span class="lv"></span></div><div class="ds">${u.ds}</div></span><span class="pr"></span>`;
  b.onclick=()=>{const n=wantN(u),c=costN(u,n);if(S.score>=c){S.score-=c;S.lv[u.id]+=n;vib(15);render();save()}};
  shop.appendChild(b)});

// sélecteur de quantité
const qb=$('qty');
[1,5,10,100,'max'].forEach(q=>{const b=document.createElement('button');b.textContent=q==='max'?'Max':'x'+q;b.dataset.q=q;
  b.onclick=()=>{qty=q==='max'?'max':+q;[...qb.children].forEach(c=>c.classList.toggle('on',c===b));render()};
  if(q===1)b.classList.add('on');qb.appendChild(b)});

// ---------- Boutique : articles ----------
const items=[];
const shop2=$('shop2');
function sec(t){const d=document.createElement('div');d.className='sec';d.textContent=t;shop2.appendChild(d)}
function addItem(it){
  const b=document.createElement('button');b.className='up';
  b.innerHTML=`<span class="ico">${it.ico}</span><span><div class="nm">${it.nm}</div><div class="ds">${it.ds}</div></span><span class="pr"></span>`;
  b.onclick=()=>it.click();it.el=b;items.push(it);shop2.appendChild(b)}
sec('💠 Gemmes — gratuites');
{const d=document.createElement('div');d.className='ds';d.style.cssText='margin:0 2px 10px;opacity:.8';
 d.textContent=`Gagne des gemmes en débloquant des succès (+${GEMS_PER_ACH} chacun) et en renaissant (+${GEMS_PER_ETERNITY} par ✦).`;shop2.appendChild(d)}
sec('Bonus à gemmes (permanents)');
PRISMS.forEach((x,i)=>addItem({ico:'🔷',nm:x.nm,ds:'+10 % de production et de clic',cur:'gem',price:()=>x.price,
  state:()=>S.own[x.id]?'done':(i>0&&!S.own[PRISMS[i-1].id]?'lock':'buy'),
  click(){if(S.own[x.id]||(i>0&&!S.own[PRISMS[i-1].id]))return;if(S.gems>=x.price){S.gems-=x.price;S.own[x.id]=1;vib(30);render();save()}}}));
sec('Boosts');
addItem({ico:'🔥',nm:'Frénésie',ds:'×3 clics et production pendant 30 s',
  price:frenzyPrice,state:()=>frenzyOn()?'on':'buy',
  click(){const p=frenzyPrice();if(S.score>=p&&!frenzyOn()){S.score-=p;S.frenzy=Date.now()+30000;S.frenzies++;vib(40);render();save()}}});
sec('Bonus permanents');
HEARTS.forEach((h,i)=>addItem({ico:'💠',nm:h.nm,ds:'+25 % de production et de clic',price:()=>h.price,
  state:()=>S.own[h.id]?'own':(i>0&&!S.own[HEARTS[i-1].id]?'lock':'buy'),
  click(){if(S.own[h.id]||(i>0&&!S.own[HEARTS[i-1].id]))return;if(S.score>=h.price){S.score-=h.price;S.own[h.id]=1;vib(30);render();save()}}}));
sec('Styles de cristal');
SKINS.forEach(k=>addItem({ico:'💎',nm:k.nm,ds:k.rainbow?'Change de couleur en continu':'Style de cristal',price:()=>k.price,
  state:()=>S.skin===k.id?'eq':S.own[k.id]?'own':'buy',
  click(){if(S.own[k.id]){S.skin=k.id;applyStyle();render();save()}else if(S.score>=k.price){S.score-=k.price;S.own[k.id]=1;S.skin=k.id;applyStyle();vib(30);render();save()}}}));
sec('Décors');
THEMES.forEach(k=>addItem({ico:'🌌',nm:k.nm,ds:'Décor de fond',price:()=>k.price,
  state:()=>S.theme===k.id?'eq':S.own[k.id]?'own':'buy',
  click(){if(S.own[k.id]){S.theme=k.id;applyStyle();render();save()}else if(S.score>=k.price){S.score-=k.price;S.own[k.id]=1;S.theme=k.id;applyStyle();vib(30);render();save()}}}));

// ---------- Succès ----------
const lvAny=n=>UPS.some(u=>S.lv[u.id]>=n);
const ACH=[
 {ico:'👆',nm:'Premier éclat',ds:'Tape 1 fois sur le cristal',v:()=>S.clicks,t:1},
 {ico:'🖐️',nm:'Doigts agiles',ds:'Tape 100 fois',v:()=>S.clicks,t:100},
 {ico:'💪',nm:'Phalanges d\'acier',ds:'Tape 1 000 fois',v:()=>S.clicks,t:1000},
 {ico:'🔥',nm:'Tendinite',ds:'Tape 10 000 fois',v:()=>S.clicks,t:10000},
 {ico:'💎',nm:'Petit trésor',ds:'Cumule 1 000 éclats',v:()=>S.maxTotal,t:1e3},
 {ico:'💰',nm:'Collectionneur',ds:'Cumule 100 000 éclats',v:()=>S.maxTotal,t:1e5},
 {ico:'🏦',nm:'Magnat',ds:'Cumule 10 millions d\'éclats',v:()=>S.maxTotal,t:1e7},
 {ico:'🌠',nm:'Éternel',ds:'Cumule 1 milliard d\'éclats',v:()=>S.maxTotal,t:1e9},
 {ico:'⚡',nm:'Ça tourne',ds:'Atteins 100 éclats/s',v:()=>baseSec(),t:100},
 {ico:'🚀',nm:'Usine à cristaux',ds:'Atteins 10 000 éclats/s',v:()=>baseSec(),t:1e4},
 {ico:'📈',nm:'Spécialiste',ds:'Un niveau 25 sur une amélioration',v:()=>Math.max(...UPS.map(u=>S.lv[u.id])),t:25},
 {ico:'🏆',nm:'Maître artisan',ds:'Un niveau 100 sur une amélioration',v:()=>Math.max(...UPS.map(u=>S.lv[u.id])),t:100},
 {ico:'🤝',nm:'Équipe complète',ds:'Possède les 6 améliorations',v:()=>UPS.filter(u=>S.lv[u.id]>0).length,t:6},
 {ico:'🌟',nm:'Écoute les étoiles',ds:'Achète une Étoile éternelle',v:()=>S.lv.sta,t:1},
 {ico:'🔥',nm:'Frénétique',ds:'Active la Frénésie 1 fois',v:()=>S.frenzies,t:1},
 {ico:'🌀',nm:'Accro à la frénésie',ds:'Active la Frénésie 10 fois',v:()=>S.frenzies,t:10},
 {ico:'💠',nm:'Cœur d\'or',ds:'Achète les 3 Cœurs de cristal',v:()=>hearts(),t:3},
 {ico:'🎨',nm:'Coquet',ds:'Achète un nouveau style de cristal',v:()=>SKINS.filter(k=>S.own[k.id]).length-1,t:1},
 {ico:'🌈',nm:'Fashion victim',ds:'Possède tous les styles de cristal',v:()=>SKINS.filter(k=>S.own[k.id]).length,t:SKINS.length},
 {ico:'🖼️',nm:'Décorateur',ds:'Possède tous les décors',v:()=>THEMES.filter(k=>S.own[k.id]).length,t:THEMES.length},
 {ico:'♻️',nm:'Renaissance',ds:'Renais 1 fois',v:()=>S.rebirths,t:1},
 {ico:'✦',nm:'Cycle infini',ds:'Renais 5 fois',v:()=>S.rebirths,t:5},
 {ico:'✨',nm:'Chasseur d\'or',ds:'Attrape 10 cristaux dorés',v:()=>S.golds,t:10},
 {ico:'🌠',nm:'Pluie battante',ds:'Attrape 50 étoiles filantes',v:()=>S.stars,t:50},
 {ico:'📅',nm:'Fidèle',ds:'Complète la série de 7 jours',v:()=>S.daily.n,t:7},
];
ACH.forEach((a,i)=>a.id='a'+i);
const shop3=$('shop3');
const achHead=document.createElement('div');achHead.className='sec';shop3.appendChild(achHead);
ACH.forEach(a=>{const b=document.createElement('div');b.className='up ach';
  b.innerHTML=`<span class="ico">${a.ico}</span><span style="flex:1"><div class="nm">${a.nm}</div><div class="ds">${a.ds}</div><div class="bar"><i></i></div></span><span class="pr"></span>`;
  a.el=b;shop3.appendChild(b)});
function checkAch(){
  S.maxTotal=Math.max(S.maxTotal,S.total);
  // Événement : chaque million d'éclats gagnés => ×10 pendant 5 minutes
  if(S.total>=S.nextMil){
    let reached=S.nextMil;while(S.nextMil<=S.total){reached=S.nextMil;S.nextMil*=MIL_STEP}
    if(!surgeOn()){S.surge=Date.now()+300000;vib([80,40,80]);tick(1200);
      toast(`⚡ <b>${fmt(reached)} éclats atteints !</b><br>Production ×10 pendant 5 minutes !<br><small>Prochain palier : ${fmt(S.nextMil)}</small>`,4500)}
    save()
  }
  const got=[];
  for(const a of ACH){if(!S.ach[a.id]&&a.v()>=a.t){S.ach[a.id]=1;got.push(a)}}
  if(got.length){S.gems+=GEMS_PER_ACH*got.length;vib([60,40,60]);tick(880);
    toast(got.map(a=>`🏆 <b>${a.nm}</b>`).join('<br>')+`<br><small>+2 % de production · +${GEMS_PER_ACH*got.length} 💠</small>`,3500);save()}
}
function renderAch(){
  achHead.textContent=`${achCount()} / ${ACH.length} débloqués · bonus +${achCount()*2} % · +${GEMS_PER_ACH} 💠 par succès`;
  for(const a of ACH){const done=!!S.ach[a.id],v=Math.min(a.v(),a.t);
    a.el.classList.toggle('done',done);
    a.el.querySelector('.bar').style.display=done?'none':'block';
    a.el.querySelector('i').style.width=(100*v/a.t)+'%';
    a.el.querySelector('.pr').textContent=done?'✔':fmt(v)+' / '+fmt(a.t)}
}

// onglets
function tab(n){$('qty').style.display=n===1?'flex':'none';$('shop3').style.display=n===3?'block':'none';$('t3').classList.toggle('on',n===3);$('shop').style.display=n===1?'block':'none';$('shop2').style.display=n===2?'block':'none';
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t3').onclick=()=>tab(3);$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

function render(){
  $('score').textContent=fmt(S.score);
  $('rate').textContent=`${fmt(perSec())} éclats/s · ${fmt(perClick())} par clic`+(S.eternity?` · ✦${S.eternity}`:'')+(S.gems?` · 💠 ${S.gems}`:'')+(weekend()?' · 🎉 Week-end ×1.5':'');
  for(const u of UPS){const b=$('u_'+u.id),n=wantN(u),c=costN(u,n);b.disabled=S.score<c;
    b.querySelector('.lv').textContent='niv. '+S.lv[u.id]+(n>1?' → '+(S.lv[u.id]+n):'');
    b.querySelector('.pr').innerHTML='💎 '+fmt(c)+(n>1?`<div class="lv">+${n} niveaux</div>`:'')}
  for(const it of items){const st=it.state(),p=it.price(),b=it.el,pr=b.querySelector('.pr');
    b.classList.toggle('own',st==='own');b.classList.toggle('eq',st==='eq');
    const bal=it.cur==='gem'?S.gems:S.score;
    b.disabled=st==='lock'||st==='on'||st==='done'||(st==='buy'&&!it.free&&bal<p);
    b.classList.toggle('own',st==='own'||st==='done');
    pr.textContent=st==='done'?'✔ Acquis':st==='own'?'Équiper':st==='eq'?'✔ Équipé':st==='lock'?'🔒':st==='on'?'Actif':it.label?it.label:(it.cur==='gem'?'💠 ':'💎 ')+fmt(p)}
  renderAch();
  $('rs').textContent=gain()>0?`Renaissance (+${gain()} ✦)`:'Renaissance (dès 10M total)';
  const f=$('frz'),pt=[],mmss=ms=>{const t=Math.ceil(ms/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
  if(surgeOn())pt.push('⚡ MILLION ×10 — '+mmss(S.surge-Date.now()));
  if(frenzyOn())pt.push('🔥 FRÉNÉSIE ×3 — '+Math.ceil((S.frenzy-Date.now())/1000)+'s');
  f.style.display=pt.length?'block':'none';f.innerHTML=pt.join('<br>');
}

// ---------- Événements spéciaux ----------
const evBox=$('ev');
const rnd=(a,b)=>a+Math.random()*(b-a);
let nextGold=Date.now()+rnd(30,60)*1000,nextRain=Date.now()+rnd(150,240)*1000;
function pop(x,y,txt,color){const d=document.createElement('div');d.className='pop';d.textContent=txt;d.style.cssText=`position:fixed;left:${x-20}px;top:${y-20}px;color:${color};z-index:9`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function banner(t,ms=2500){const b=document.createElement('div');b.className='evmsg';b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),ms)}
function spawnGold(){
  const el=document.createElement('div');el.className='gold';
  const sr=$('stage').getBoundingClientRect();
  el.style.left=rnd(20,innerWidth-84)+'px';el.style.top=rnd(Math.max(20,sr.top-20),sr.bottom-80)+'px';
  el.style.setProperty('--dx',rnd(-60,60)+'px');
  el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.remove();S.golds++;
    const r0=Math.random(),rect=el.getBoundingClientRect(),x=rect.left+30,y=rect.top+30;
    if(r0<0.12){S.gems+=5;pop(x,y,'+5 💠','#7df9ff');toast('✨ Cristal doré : <b>+5 gemmes</b> !',2500)}
    else if(r0<0.30){S.frenzy=Math.max(S.frenzy,Date.now())+20000;pop(x,y,'🔥 ×3','#ffb347');toast('✨ Cristal doré : <b>Frénésie ×3</b> pendant 20 s !',2500)}
    else{const r=Math.max(perSec()*100,perClick()*100,100);S.score+=r;S.total+=r;pop(x,y,'+'+fmt(r),'#ffe27d');toast(`✨ Cristal doré : <b>+${fmt(r)}</b> éclats !`,2500)}
    vib([30,30,30]);tick(990);render();save()});
  evBox.appendChild(el);setTimeout(()=>el.remove(),8000);
  banner('✨ Un cristal doré est apparu !');tick(700)}
function startRain(){
  banner('🌠 PLUIE D\'ÉTOILES — attrape-les !',3500);tick(600);
  const n=18;
  for(let i=0;i<n;i++)setTimeout(()=>{
    const el=document.createElement('div');el.className='star';el.textContent='⭐';
    el.style.left=rnd(10,innerWidth-50)+'px';el.style.animationDuration=rnd(3.5,5.5)+'s';
    el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.remove();S.stars++;
      const r=Math.max(perSec()*8,perClick()*8,10);S.score+=r;S.total+=r;
      const b=el.getBoundingClientRect();pop(b.left+15,b.top+15,'+'+fmt(r),'#fff3a8');tick(800+Math.random()*400);vib(10);render()});
    evBox.appendChild(el);setTimeout(()=>el.remove(),6000)},i*650)}
function eventsTick(){
  if(document.hidden||S.total<100)return;
  const n=Date.now();
  if(n>nextGold){spawnGold();nextGold=n+rnd(45,90)*1000}
  if(n>nextRain){startRain();nextRain=n+rnd(180,300)*1000}
}
// Récompense quotidienne (série de 7 jours)
function dailyReward(){
  const today=new Date().toLocaleDateString('sv'),yest=new Date(Date.now()-864e5).toLocaleDateString('sv');
  if(S.daily.d===today)return null;
  const n=S.daily.d===yest?(S.daily.n%7)+1:1;
  S.daily={d:today,n};
  const gold=Math.max(500,baseSec()*mult()*300)*n,gems=n===7?30:2;
  S.score+=gold;S.total+=gold;S.gems+=gems;save();
  return `🎁 <b>Récompense du jour ${n}/7</b><br>+${fmt(gold)} éclats · +${gems} 💠`+(n<7?'<br><small>Reviens demain pour la suite !</small>':'<br><small>Série complète ! Elle repart demain.</small>')}

// ---------- Clic ----------
$('gem').addEventListener('pointerdown',e=>{
  e.preventDefault();
  let v=perClick();
  S.score+=v;S.total+=v;S.clicks++;
  const g=$('gem');g.classList.add('hit');setTimeout(()=>g.classList.remove('hit'),60);
  const p=document.createElement('div');p.className='pop';p.textContent='+'+fmt(v);
  const r=$('stage').getBoundingClientRect();p.style.left=(e.clientX-r.left-12+(Math.random()*30-15))+'px';p.style.top=(e.clientY-r.top-20)+'px';
  $('stage').appendChild(p);setTimeout(()=>p.remove(),900);
  tick(400+Math.random()*300);vib(8);
  render();
});

// ---------- Boucle ----------
let lt=performance.now(),acc=0;
setInterval(()=>{const n=performance.now(),dt=Math.min((n-lt)/1000,1);lt=n;const v=perSec()*dt;S.score+=v;S.total+=v;
  acc+=dt;if(acc>1){acc=0;save()}checkAch();eventsTick();render()},100);

// Gains hors-ligne (30 %, 4 h max)
const off=Math.min((Date.now()-S.last)/1000,4*3600);
if(off>30&&baseSec()>0){const v=baseSec()*(1+S.eternity*0.25)*(1+hearts()*0.25)*(1+achCount()*0.02)*(1+prisms()*0.1)*off*0.3;S.score+=v;S.total+=v;
  toast(`Bon retour !<br>Tes cristaux ont produit <b>${fmt(v)}</b> éclats pendant ton absence.`,4500)}

{const d=dailyReward();if(d)setTimeout(()=>toast(d,5000),off>30?5200:600)}
$('rs').onclick=()=>{const g=gain();if(g<1)return alert('Il faut avoir cumulé 10M d\'éclats pour renaître.');
  if(confirm(`Renaître ? Tu perds éclats et améliorations (tes styles et bonus de boutique restent), mais gagnes +${g} ✦ (chaque ✦ = +25 % de production) et +${g*GEMS_PER_ETERNITY} 💠.`)){
    S.eternity+=g;S.gems+=g*GEMS_PER_ETERNITY;S.rebirths++;S.nextMil=1e6;S.score=0;S.total=0;UPS.forEach(u=>S.lv[u.id]=0);save();render()}};
$('rst').onclick=()=>{if(confirm('Tout effacer, y compris ta progression ?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
document.addEventListener('visibilitychange',()=>{save();if(!document.hidden){lt=performance.now()}});
addEventListener('pagehide',save);
document.addEventListener('dblclick',e=>e.preventDefault());

applyStyle();render();
window.__ee={S,checkAch,spawnGold,startRain,applyStyle};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
