<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Éclats Éternels</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0820;color:#fff;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  :root{--bg1:#2a1050;--bg2:#0b0820}
  body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 70%);display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #top{text-align:center;padding:14px 12px 0}
  #score{font-size:clamp(34px,10vw,52px);font-weight:800;
    background:linear-gradient(90deg,#7df9ff,#c77dff,#ff7de0);-webkit-background-clip:text;background-clip:text;color:transparent}
  #rate{opacity:.75;font-size:14px;margin-top:2px}
  #stage{position:relative;flex:0 0 38%;display:flex;align-items:center;justify-content:center}
  #gem{width:min(46vw,200px);aspect-ratio:.8;cursor:pointer;transition:transform .06s;filter:drop-shadow(0 0 30px #7df9ffaa)}
  #gem.hit{transform:scale(.9)}
  .pop{position:absolute;pointer-events:none;font-weight:800;font-size:24px;color:#ffe27d;text-shadow:0 0 8px #000;
    animation:up .9s ease-out forwards}
  @keyframes up{to{transform:translateY(-90px);opacity:0}}
  #shop,#shop2{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px;-webkit-overflow-scrolling:touch}
  .up{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 8px;padding:10px 12px;border-radius:14px;border:1px solid #ffffff22;
    background:#ffffff10;color:#fff;text-align:left;font:inherit}
  .up:disabled{opacity:.4}
  .up:not(:disabled):active{background:#7df9ff33;transform:scale(.98)}
  .ico{font-size:28px;width:36px;text-align:center}
  .nm{font-weight:700}.ds{font-size:12px;opacity:.7}
  .pr{margin-left:auto;text-align:right;font-weight:700;color:#7df9ff;white-space:nowrap}
  .lv{font-size:12px;opacity:.7;font-weight:400;color:#fff}
  #bar{display:flex;justify-content:center;gap:8px;padding:0 12px 6px;font-size:12px}
  #bar button{background:none;border:1px solid #ffffff33;color:#ffffffaa;border-radius:20px;padding:5px 12px;font:inherit}
  #tabs{display:flex;gap:8px;padding:0 12px 8px}
  #tabs button{flex:1;padding:9px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff10;color:#fff;font:inherit;font-weight:700}
  #tabs button.on{background:linear-gradient(90deg,#7df9ff55,#c77dff55);border-color:#7df9ff}
  #qty{display:flex;gap:6px;padding:0 12px 8px}
  #qty button{flex:1;padding:7px 0;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font:inherit;font-weight:700;font-size:14px}
  #qty button.on{background:#ffe27d33;border-color:#ffe27d;color:#ffe27d}
  .sec{margin:10px 2px 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.6}
  .up.own .pr{color:#7dffb0}.up.eq{border-color:#ffe27d;background:#ffe27d18}.up.eq .pr{color:#ffe27d}
  #frz{display:none;position:absolute;bottom:4px;left:0;right:0;text-align:center;font-weight:800;color:#ffb347}
  .rainbow #gem{animation:rb 4s linear infinite}@keyframes rb{to{filter:drop-shadow(0 0 30px #fff8) hue-rotate(360deg)}}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#000c;padding:12px 18px;border-radius:14px;
    text-align:center;display:none;max-width:85vw;z-index:9}
</style>
</head>
<body>
<div id="top"><div id="score">0</div><div id="rate"></div></div>
<div id="stage">
  <div id="frz"></div>
  <svg id="gem" viewBox="0 0 100 125">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop id="s1" offset="0" stop-color="#7df9ff"/><stop id="s2" offset="1" stop-color="#c77dff"/></linearGradient></defs>
    <path d="M50 2 96 62 50 123 4 62Z" fill="url(#g)"/>
    <path d="M50 2 96 62 50 62Z" fill="#fff" opacity=".4"/>
    <path d="M50 62 4 62 50 2Z" fill="#fff" opacity=".15"/>
  </svg>
</div>
<div id="tabs"><button id="t1" class="on">⚒️ Améliorations</button><button id="t2">🛍️ Boutique</button></div>
<div id="qty"></div>
<div id="shop"></div>
<div id="shop2" style="display:none;flex:1;overflow-y:auto;padding:8px 12px 12px"></div>
<div id="bar"><button id="rs">Renaissance</button><button id="rst">Tout effacer</button></div>
<div id="toast"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const UPS=[
 {id:'tap',ico:'👆',nm:'Doigt de lumière',   ds:'+1 éclat par clic',base:40,    g:1.40,click:1},
 {id:'spr',ico:'✨',nm:'Étincelle',          ds:'+1 éclat / s',     base:120,   g:1.25,ps:1},
 {id:'min',ico:'⛏️',nm:'Mineur de cristal',  ds:'+5 éclats / s',    base:1200,  g:1.25,ps:5},
 {id:'gol',ico:'🗿',nm:'Golem de quartz',    ds:'+30 éclats / s',   base:14000, g:1.25,ps:30},
 {id:'dra',ico:'🐉',nm:'Dragon prismatique', ds:'+200 éclats / s',  base:160000,g:1.25,ps:200},
 {id:'sta',ico:'🌟',nm:'Étoile éternelle',   ds:'+1500 éclats / s', base:1800000,g:1.25,ps:1500},
];
const SKINS=[
 {id:'ame',nm:'Améthyste',c:['#7df9ff','#c77dff'],glow:'#7df9ffaa',price:0},
 {id:'rub',nm:'Rubis',c:['#ff9db5','#e0103a'],glow:'#ff2d55aa',price:3000},
 {id:'eme',nm:'Émeraude',c:['#9dffc8','#00a86b'],glow:'#00e08aaa',price:15000},
 {id:'or', nm:'Or pur',c:['#fff3a8','#ffa500'],glow:'#ffc400aa',price:80000},
 {id:'gla',nm:'Glace',c:['#f0fcff','#3d9bff'],glow:'#8fd3ffaa',price:400000},
 {id:'obs',nm:'Obsidienne',c:['#8a8aaa','#14142a'],glow:'#8a8aaaaa',price:2500000},
 {id:'arc',nm:'Arc-en-ciel',c:['#ff7de0','#7df9ff'],glow:'#fff8',price:25000000,rainbow:1},
];
const THEMES=[
 {id:'nuit',nm:'Nuit violette',b:['#2a1050','#0b0820'],price:0},
 {id:'aur', nm:'Aurore',b:['#0e5a5a','#07141f'],price:8000},
 {id:'bra', nm:'Braises',b:['#6a1a0a','#150505'],price:40000},
 {id:'for', nm:'Forêt féerique',b:['#14532d','#04140b'],price:200000},
 {id:'aby', nm:'Abysses',b:['#0b3a8a','#020617'],price:1500000},
 {id:'cos', nm:'Nébuleuse',b:['#7a1f6b','#0a0320'],price:10000000},
];
const HEARTS=[{id:'h1',nm:'Cœur de cristal I',price:60000},{id:'h2',nm:'Cœur de cristal II',price:600000},{id:'h3',nm:'Cœur de cristal III',price:6000000}];
const KEY='ee_clicker';
let S={score:0,total:0,lv:{},eternity:0,last:Date.now(),own:{ame:1,nuit:1},skin:'ame',theme:'nuit',frenzy:0};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r)S=Object.assign(S,r)}catch(e){}
S.own=Object.assign({ame:1,nuit:1},S.own);
UPS.forEach(u=>S.lv[u.id]=S.lv[u.id]||0);

const frenzyOn=()=>Date.now()<S.frenzy;
const hearts=()=>HEARTS.filter(h=>S.own[h.id]).length;
const mult=()=>(1+S.eternity*0.25)*(1+hearts()*0.25)*(frenzyOn()?3:1);
const cost=u=>Math.ceil(u.base*Math.pow(u.g,S.lv[u.id]));
let qty=1;
// coût de n niveaux d'un coup (somme géométrique)
const costN=(u,n)=>Math.ceil(u.base*Math.pow(u.g,S.lv[u.id])*(Math.pow(u.g,n)-1)/(u.g-1));
const maxN=u=>{let n=0;while(n<1000&&costN(u,n+1)<=S.score)n++;return n};
const wantN=u=>qty==='max'?Math.max(1,maxN(u)):qty;
const perClick=()=>(1+UPS.reduce((a,u)=>a+(u.click||0)*S.lv[u.id],0))*mult();
const perSec=()=>UPS.reduce((a,u)=>a+(u.ps||0)*S.lv[u.id],0)*mult();
const baseSec=()=>perSec()/mult();
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n)+'';
  const s=['k','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<s.length-1){n/=1000;i++}return n.toFixed(n<10?2:1)+s[i]};
const ETERNITY_AT=1e7;
const gain=()=>Math.floor(Math.sqrt(S.total/ETERNITY_AT));
const frenzyPrice=()=>Math.max(800,Math.ceil(baseSec()*200));
const save=()=>{S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let ac;function tick(f){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.06;
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.08);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}catch(e){}}
function toast(h,ms=3500){const t=$('toast');t.innerHTML=h;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}

// ---------- Styles ----------
function applyStyle(){
  const sk=SKINS.find(x=>x.id===S.skin)||SKINS[0],th=THEMES.find(x=>x.id===S.theme)||THEMES[0];
  $('s1').setAttribute('stop-color',sk.c[0]);$('s2').setAttribute('stop-color',sk.c[1]);
  $('gem').style.filter=`drop-shadow(0 0 30px ${sk.glow})`;
  document.body.classList.toggle('rainbow',!!sk.rainbow);
  document.documentElement.style.setProperty('--bg1',th.b[0]);document.documentElement.style.setProperty('--bg2',th.b[1]);
  $('top') && document.querySelector('meta[name=theme-color]').setAttribute('content',th.b[1]);
}

// ---------- Boutique : améliorations ----------
const shop=$('shop');
UPS.forEach(u=>{const b=document.createElement('button');b.className='up';b.id='u_'+u.id;
  b.innerHTML=`<span class="ico">${u.ico}</span><span><div class="nm">${u.nm} <span class="lv"></span></div><div class="ds">${u.ds}</div></span><span class="pr"></span>`;
  b.onclick=()=>{const n=wantN(u),c=costN(u,n);if(S.score>=c){S.score-=c;S.lv[u.id]+=n;vib(15);render();save()}};
  shop.appendChild(b)});

// sélecteur de quantité
const qb=$('qty');
[1,5,10,100,'max'].forEach(q=>{const b=document.createElement('button');b.textContent=q==='max'?'Max':'x'+q;b.dataset.q=q;
  b.onclick=()=>{qty=q==='max'?'max':+q;[...qb.children].forEach(c=>c.classList.toggle('on',c===b));render()};
  if(q===1)b.classList.add('on');qb.appendChild(b)});

// ---------- Boutique : articles ----------
const items=[];
const shop2=$('shop2');
function sec(t){const d=document.createElement('div');d.className='sec';d.textContent=t;shop2.appendChild(d)}
function addItem(it){
  const b=document.createElement('button');b.className='up';
  b.innerHTML=`<span class="ico">${it.ico}</span><span><div class="nm">${it.nm}</div><div class="ds">${it.ds}</div></span><span class="pr"></span>`;
  b.onclick=()=>it.click();it.el=b;items.push(it);shop2.appendChild(b)}
sec('Boosts');
addItem({ico:'🔥',nm:'Frénésie',ds:'×3 clics et production pendant 30 s',
  price:frenzyPrice,state:()=>frenzyOn()?'on':'buy',
  click(){const p=frenzyPrice();if(S.score>=p&&!frenzyOn()){S.score-=p;S.frenzy=Date.now()+30000;vib(40);render();save()}}});
sec('Bonus permanents');
HEARTS.forEach((h,i)=>addItem({ico:'💠',nm:h.nm,ds:'+25 % de production et de clic',price:()=>h.price,
  state:()=>S.own[h.id]?'own':(i>0&&!S.own[HEARTS[i-1].id]?'lock':'buy'),
  click(){if(S.own[h.id]||(i>0&&!S.own[HEARTS[i-1].id]))return;if(S.score>=h.price){S.score-=h.price;S.own[h.id]=1;vib(30);render();save()}}}));
sec('Styles de cristal');
SKINS.forEach(k=>addItem({ico:'💎',nm:k.nm,ds:k.rainbow?'Change de couleur en continu':'Style de cristal',price:()=>k.price,
  state:()=>S.skin===k.id?'eq':S.own[k.id]?'own':'buy',
  click(){if(S.own[k.id]){S.skin=k.id;applyStyle();render();save()}else if(S.score>=k.price){S.score-=k.price;S.own[k.id]=1;S.skin=k.id;applyStyle();vib(30);render();save()}}}));
sec('Décors');
THEMES.forEach(k=>addItem({ico:'🌌',nm:k.nm,ds:'Décor de fond',price:()=>k.price,
  state:()=>S.theme===k.id?'eq':S.own[k.id]?'own':'buy',
  click(){if(S.own[k.id]){S.theme=k.id;applyStyle();render();save()}else if(S.score>=k.price){S.score-=k.price;S.own[k.id]=1;S.theme=k.id;applyStyle();vib(30);render();save()}}}));

// onglets
function tab(n){$('qty').style.display=n===1?'flex':'none';$('shop').style.display=n===1?'block':'none';$('shop2').style.display=n===2?'block':'none';
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

function render(){
  $('score').textContent=fmt(S.score);
  $('rate').textContent=`${fmt(perSec())} éclats/s · ${fmt(perClick())} par clic`+(S.eternity?` · ✦${S.eternity}`:'');
  for(const u of UPS){const b=$('u_'+u.id),n=wantN(u),c=costN(u,n);b.disabled=S.score<c;
    b.querySelector('.lv').textContent='niv. '+S.lv[u.id]+(n>1?' → '+(S.lv[u.id]+n):'');
    b.querySelector('.pr').innerHTML='💎 '+fmt(c)+(n>1?`<div class="lv">+${n} niveaux</div>`:'')}
  for(const it of items){const st=it.state(),p=it.price(),b=it.el,pr=b.querySelector('.pr');
    b.classList.toggle('own',st==='own');b.classList.toggle('eq',st==='eq');
    b.disabled=st==='lock'||st==='on'||(st==='buy'&&S.score<p);
    pr.textContent=st==='own'?'Équiper':st==='eq'?'✔ Équipé':st==='lock'?'🔒':st==='on'?'Actif':'💎 '+fmt(p)}
  $('rs').textContent=gain()>0?`Renaissance (+${gain()} ✦)`:'Renaissance (dès 10M total)';
  const f=$('frz');if(frenzyOn()){f.style.display='block';f.textContent='🔥 FRÉNÉSIE ×3 — '+Math.ceil((S.frenzy-Date.now())/1000)+'s'}else f.style.display='none';
}

// ---------- Clic ----------
$('gem').addEventListener('pointerdown',e=>{
  e.preventDefault();
  let v=perClick();
  S.score+=v;S.total+=v;
  const g=$('gem');g.classList.add('hit');setTimeout(()=>g.classList.remove('hit'),60);
  const p=document.createElement('div');p.className='pop';p.textContent='+'+fmt(v);
  const r=$('stage').getBoundingClientRect();p.style.left=(e.clientX-r.left-12+(Math.random()*30-15))+'px';p.style.top=(e.clientY-r.top-20)+'px';
  $('stage').appendChild(p);setTimeout(()=>p.remove(),900);
  tick(400+Math.random()*300);vib(8);
  render();
});

// ---------- Boucle ----------
let lt=performance.now(),acc=0;
setInterval(()=>{const n=performance.now(),dt=Math.min((n-lt)/1000,1);lt=n;const v=perSec()*dt;S.score+=v;S.total+=v;
  acc+=dt;if(acc>1){acc=0;save()}render()},100);

// Gains hors-ligne (30 %, 4 h max)
const off=Math.min((Date.now()-S.last)/1000,4*3600);
if(off>30&&baseSec()>0){const v=baseSec()*(1+S.eternity*0.25)*(1+hearts()*0.25)*off*0.3;S.score+=v;S.total+=v;
  toast(`Bon retour !<br>Tes cristaux ont produit <b>${fmt(v)}</b> éclats pendant ton absence.`,4500)}

$('rs').onclick=()=>{const g=gain();if(g<1)return alert('Il faut avoir cumulé 10M d\'éclats pour renaître.');
  if(confirm(`Renaître ? Tu perds éclats et améliorations (tes styles et bonus de boutique restent), mais gagnes +${g} ✦ (chaque ✦ = +25 % de production).`)){
    S.eternity+=g;S.score=0;S.total=0;UPS.forEach(u=>S.lv[u.id]=0);save();render()}};
$('rst').onclick=()=>{if(confirm('Tout effacer, y compris ta progression ?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
document.addEventListener('visibilitychange',()=>{save();if(!document.hidden){lt=performance.now()}});
addEventListener('pagehide',save);
document.addEventListener('dblclick',e=>e.preventDefault());

applyStyle();render();
window.__ee={S};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
