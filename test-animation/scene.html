<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vol de nuit - test</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<script>
const W = 540, H = 960;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Arial Black","Liberation Sans","DejaVu Sans",Arial,sans-serif';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, size, fill, stroke, sw, align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

/* ---------- Décor : cabine d'avion de nuit ---------- */
function drawCabin(t, flick) {
  // fond
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a2160'); g.addColorStop(0.5, '#10154a'); g.addColorStop(1, '#05061c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // plafond
  ctx.fillStyle = '#2a3380';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(372, 330); ctx.lineTo(168, 330); ctx.closePath(); ctx.fill();
  // coffres à bagages
  ctx.fillStyle = '#3a47a8';
  ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(150, 250); ctx.lineTo(178, 250); ctx.lineTo(178, 330); ctx.lineTo(0, 170); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, 40); ctx.lineTo(390, 250); ctx.lineTo(362, 250); ctx.lineTo(362, 330); ctx.lineTo(W, 170); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(160,175,255,.25)'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const k = i / 5;
    ctx.beginPath(); ctx.moveTo(0, 40 + 130 * k); ctx.lineTo(150 + 28 * k, 250 + 80 * k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W, 40 + 130 * k); ctx.lineTo(390 - 28 * k, 250 + 80 * k); ctx.stroke();
  }
  // mur du fond + porte
  ctx.fillStyle = '#0e1240'; ctx.fillRect(168, 330, 204, 230);
  ctx.fillStyle = '#161c58'; rr(215, 360, 110, 200, 8); ctx.fill();
  ctx.fillStyle = 'rgba(180,190,255,.5)'; ctx.fillRect(263, 380, 14, 26);
  // plancher
  g = ctx.createLinearGradient(0, 560, 0, H);
  g.addColorStop(0, '#0a0d34'); g.addColorStop(1, '#03040f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(168, 560); ctx.lineTo(372, 560); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  // bande d'allée
  ctx.strokeStyle = 'rgba(120,135,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(235, 560); ctx.lineTo(120, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(305, 560); ctx.lineTo(420, H); ctx.stroke();

  // rangées de sièges (de loin vers près)
  const rows = [
    { y: 440, h: 70, w: 58, xi: 196 },
    { y: 480, h: 92, w: 78, xi: 178 },
    { y: 540, h: 125, w: 108, xi: 150 },
    { y: 640, h: 175, w: 150, xi: 110 }
  ];
  rows.forEach((r, i) => {
    [[r.xi - r.w, 'L'], [W - r.xi, 'R']].forEach(([x, side]) => {
      ctx.fillStyle = '#171d62'; rr(x, r.y, r.w, r.h, 14); ctx.fill();
      ctx.strokeStyle = '#3f4cc0'; ctx.lineWidth = 2; ctx.stroke();
      // appuie-tête
      ctx.fillStyle = '#222a82'; rr(x + r.w * 0.2, r.y - r.h * 0.12, r.w * 0.6, r.h * 0.3, 10); ctx.fill();
      // silhouettes de passagers endormis
      if ((i + (side === 'L' ? 0 : 1)) % 2 === 0 && i < 3) {
        ctx.fillStyle = '#080a2a';
        ctx.beginPath(); ctx.arc(x + r.w / 2, r.y - r.h * 0.22, r.h * 0.2, 0, 7); ctx.fill();
      }
    });
  });

  // spots de plafond qui clignotent
  for (let i = 0; i < 4; i++) {
    const k = i / 4, y = 40 + 280 * Math.pow(k, 1.1), w = 70 - 45 * k;
    ctx.fillStyle = `rgba(190,205,255,${(0.55 - 0.3 * k) * flick})`;
    rr(270 - w / 2, y, w, 8 - 4 * k, 4); ctx.fill();
  }
}

/* ---------- Personnages ---------- */
function drawChar(x, y, s, o) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((o.lean || 0) * Math.PI / 180);
  ctx.lineJoin = 'round';
  const outline = '#14152e';

  // jambes
  const sw = (o.swing || 0);
  [[-26, 0], [20, 1]].forEach(([lx, k]) => {
    ctx.save();
    ctx.translate(lx * s, 0);
    ctx.rotate((sw * (k ? -1 : 1)) * Math.PI / 180);
    ctx.fillStyle = o.pants; rr(-18 * s, -6 * s, 36 * s, 120 * s, 16 * s); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = outline; ctx.stroke();
    ctx.fillStyle = '#8f98e6'; ctx.beginPath(); ctx.ellipse(6 * s, 124 * s, 30 * s, 15 * s, 0.2, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
  });

  // buste
  ctx.fillStyle = o.sweater; rr(-48 * s, -125 * s, 96 * s, 130 * s, 26 * s); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = outline; ctx.stroke();
  // bras
  ctx.fillStyle = o.sweater;
  rr(-68 * s, -115 * s, 28 * s, 100 * s, 14 * s); ctx.fill(); ctx.stroke();
  rr(40 * s, -115 * s, 28 * s, 100 * s, 14 * s); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4f4f8';
  ctx.beginPath(); ctx.arc(-54 * s, -10 * s, 11 * s, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(54 * s, -10 * s, 11 * s, 0, 7); ctx.fill(); ctx.stroke();

  // tête
  ctx.save();
  ctx.translate(0, -185 * s);
  ctx.rotate((o.tilt || 0) * Math.PI / 180);
  const R = 62 * s;
  ctx.fillStyle = '#f6f6fa'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = outline; ctx.stroke();

  // bonnet
  if (o.beanie) {
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
    ctx.fillStyle = o.beanie; ctx.fillRect(-R, -R, 2 * R, R * 1.05);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-R, -R * 0.25, 2 * R, R * 0.18);
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
  }
  // masque de sommeil relevé sur le front
  if (o.mask) {
    ctx.save(); ctx.rotate(-0.08);
    ctx.fillStyle = '#15163a'; rr(-R * 0.8, -R * 0.62, R * 1.6, R * 0.42, R * 0.2); ctx.fill();
    ctx.strokeStyle = '#4a55c8'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // yeux
  const ey = 8 * s;
  ctx.fillStyle = '#0a0a18'; ctx.strokeStyle = '#0a0a18';
  if (o.closed) {
    ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
    [-20, 20].forEach(ex => { ctx.beginPath(); ctx.arc(ex * s, ey, 9 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); });
  } else {
    const bl = o.blink ? 0.12 : 1;
    [-20, 20].forEach(ex => {
      const lx = (o.look || 0) * 5 * s;
      ctx.beginPath(); ctx.ellipse(ex * s + lx, ey, 8.5 * s, 11 * s * bl, 0, 0, 7); ctx.fill();
      if (!o.blink) {
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex * s + lx - 2.5 * s, ey - 4 * s, 2.6 * s, 0, 7); ctx.fill();
        ctx.fillStyle = '#0a0a18';
      }
    });
    // sourcils inquiets
    if (o.worry) {
      ctx.lineWidth = 3 * s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-32 * s, -8 * s); ctx.lineTo(-10 * s, -14 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(32 * s, -8 * s); ctx.lineTo(10 * s, -14 * s); ctx.stroke();
    }
  }
  // goutte de sueur
  if (o.sweat) {
    ctx.fillStyle = '#9fd8ff';
    ctx.beginPath(); ctx.moveTo(44 * s, -20 * s); ctx.quadraticCurveTo(54 * s, -2 * s, 44 * s, 4 * s); ctx.quadraticCurveTo(34 * s, -2 * s, 44 * s, -20 * s); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

/* ---------- Silhouette à la lampe torche ---------- */
function drawFlashlight(t, flick, turn) {
  // silhouette
  ctx.save();
  ctx.translate(40, 560);
  ctx.fillStyle = '#04051a';
  rr(-70, -10, 150, 230, 50); ctx.fill();
  ctx.beginPath(); ctx.arc(10 + turn * -6, -50, 58, 0, 7); ctx.fill();
  // masque de nuit sur la tête
  ctx.fillStyle = '#0b0d2e'; rr(-28 + turn * -6, -70, 76, 26, 12); ctx.fill();
  // bras + lampe
  ctx.save(); ctx.translate(55, 20); ctx.rotate(-0.12);
  ctx.fillStyle = '#04051a'; rr(0, -16, 95, 34, 14); ctx.fill();
  ctx.fillStyle = '#9aa3c8'; rr(70, -20, 52, 40, 8); ctx.fill();
  ctx.restore();
  ctx.restore();

  // faisceau
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ox = 165, oy = 566;
  const spread = 130 + 14 * Math.sin(t * 5);
  const g = ctx.createLinearGradient(ox, oy, 540, oy);
  g.addColorStop(0, `rgba(220,230,255,${0.75 * flick})`);
  g.addColorStop(1, 'rgba(220,230,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(ox, oy - 10); ctx.lineTo(540, oy - spread - 40); ctx.lineTo(540, oy + spread + 120); ctx.lineTo(ox, oy + 12); ctx.closePath(); ctx.fill();
  // halo
  const rg = ctx.createRadialGradient(ox, oy, 0, ox, oy, 70);
  rg.addColorStop(0, `rgba(255,255,255,${0.95 * flick})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(ox, oy, 70, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- Interface : titre, vote, sous-titres ---------- */
function drawTitle(t) {
  const p = back(seg(t, 0.25, 0.75));
  const bob = Math.sin(t * 2) * 2;
  ctx.save(); ctx.translate(270, 105 + bob); ctx.scale(p, p);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  text('VOL DE NUIT', 0, 0, 66, '#ff4538', '#2b0707', 10);
  ctx.shadowColor = 'transparent';
  ctx.restore();
  const p2 = back(seg(t, 0.5, 1.0));
  ctx.save(); ctx.translate(270, 168 + bob); ctx.scale(p2, p2);
  text('PARTIE 1', 0, 0, 40, '#ffffff', '#101024', 9);
  ctx.restore();
}

function drawPoll(t) {
  const inn = ease(seg(t, 1.0, 1.55));
  const out = ease(seg(t, 8.5, 8.95));
  const off = (1 - inn) * -320 - out * 320;
  if (inn <= 0 || out >= 1) return;
  ctx.save(); ctx.translate(0, off);
  const x = 40, y = 205, w = 460, h = 205;
  ctx.fillStyle = 'rgba(14,14,26,.78)'; rr(x, y, w, h, 24); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.stroke();
  text('PARTIE 1 · VOS VOTES', 270, y + 32, 19, '#fff', null, 0);
  const bw = w - 40, bx = x + 20;
  const fillA = 0.24 * ease(seg(t, 1.7, 3.2));
  const fillB = 0.9 * ease(seg(t, 1.9, 3.4));
  // A
  text('A · TU RÉPONDS À SA PLACE', bx, y + 76, 16, '#e8e8f4', null, 0, 'left');
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rr(bx, y + 92, bw, 30, 15); ctx.fill();
  if (fillA > 0.02) { ctx.fillStyle = '#8a90b4'; rr(bx, y + 92, Math.max(30, bw * fillA), 30, 15); ctx.fill(); }
  // B
  text('B · TU LA SECOUES', bx, y + 146, 16, '#e8e8f4', null, 0, 'left');
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rr(bx, y + 162, bw, 30, 15); ctx.fill();
  const bwid = Math.max(30, bw * fillB);
  ctx.fillStyle = '#ffc928'; rr(bx, y + 162, bwid, 30, 15); ctx.fill();
  if (fillB > 0.6) text('LA MAJORITÉ', bx + bwid / 2, y + 178, 15, '#2b2108', null, 0);
  ctx.restore();
}

function subtitle(str, a, b, t, y = 740, size = 46, color = '#fff') {
  if (t < a || t > b) return;
  const p = back(seg(t, a, a + 0.28));
  const fade = 1 - seg(t, b - 0.15, b);
  ctx.save(); ctx.globalAlpha = fade;
  ctx.translate(270, y); ctx.scale(p, p);
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  text(str, 0, 0, size, color, '#05061a', 9);
  ctx.restore();
}

/* ---------- Rendu d'une image à l'instant t ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // secousses de turbulence
  let shake = 0;
  if (t > 4.4 && t < 5.3) shake = 1;
  if (t > 8.0 && t < 8.9) shake = 1.6;
  if (t > 9.0 && t < 9.35) shake = 2.2;
  const sx = shake * (Math.sin(t * 61) * 4 + Math.sin(t * 37) * 3);
  const sy = shake * (Math.sin(t * 53 + 1) * 4);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(1.03, 1.03); ctx.translate(-8, -14); // marge pour la secousse

  // lumière qui clignote
  let flick = 1;
  if (t > 3.9 && t < 4.4) flick = (Math.sin(t * 90) > 0.2) ? 1 : 0.25;
  if (t > 8.0 && t < 9.3) flick = (Math.sin(t * 70) > -0.1) ? 1 : 0.15;
  if (t > 9.3) flick = 1;

  drawCabin(t, flick);
  drawFlashlight(t, flick, ease(seg(t, 8.2, 8.8)));

  // personnages
  const breathe = Math.sin(t * 1.6) * 2;
  // B : endormie, appuyée sur A
  drawChar(350, 760 + breathe * 0.6, 0.9, {
    sweater: '#6b5a3c', pants: '#1c2a6e', swing: 2 + Math.sin(t * 1.3) * 3,
    lean: 4 + Math.sin(t * 1.2) * 1.5, tilt: -16 + Math.sin(t * 1.2) * 2, closed: true
  });
  // A : réveillé, regarde la lumière
  const blink = (t % 3.2) > 3.05;
  const scared = t > 3.0;
  drawChar(250, 790 + breathe, 1.0, {
    sweater: '#8a8ea2', pants: '#1b2c78', beanie: '#8a2030', mask: true,
    swing: 4 + Math.sin(t * 1.5) * 4, lean: -3 + Math.sin(t * 1.1) * 1.2,
    tilt: -5 + Math.sin(t * 1.4) * 2, look: -1, blink, worry: scared, sweat: t > 5.0
  });

  // ombre portée de la lampe sur les personnages
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const lg = ctx.createRadialGradient(250, 680, 10, 250, 680, 340);
  lg.addColorStop(0, `rgba(190,205,255,${0.16 * flick})`); lg.addColorStop(1, 'rgba(190,205,255,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 300, W, 660);
  ctx.restore();
  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(270, 480, 280, 270, 480, 620);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,12,.62)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // UI
  drawTitle(t);
  drawPoll(t);
  subtitle('ELLE NE BOUGE PLUS…', 3.0, 4.6, t, 760, 36);
  subtitle('UN', 5.0, 6.0, t, 760, 64);
  subtitle('DEUX', 6.2, 7.2, t, 760, 64);
  subtitle('TROIS', 7.4, 8.6, t, 760, 64, '#ffd84a');
  subtitle('À SUIVRE…', 9.35, 10.1, t, 800, 40, '#ff4538');

  // éclair blanc au moment du choc
  const fl = Math.max(0, 1 - Math.abs(t - 9.0) / 0.12);
  if (fl > 0) { ctx.fillStyle = `rgba(235,240,255,${fl * 0.85})`; ctx.fillRect(0, 0, W, H); }

  // fondu d'entrée / sortie
  const fi = 1 - seg(t, 0, 0.5);
  const fo = seg(t, 9.7, 10);
  const black = Math.max(fi, fo);
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
render(0);
</script>
</body>
</html>
